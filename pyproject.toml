[project]
name = "machinefile"
version = "0.1.4"
description = "Compile a Machinefile (Dockerfile-syntax) into an Ansible playbook with Docker layer-cache semantics"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Alan Justino", email = "alan.justino@yahoo.com.br" }]
license-files = ["LICENSE"]
keywords = ["machinefile", "ansible", "dockerfile", "provisioning", "reproducible"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0.3",
    "rich-click>=1.9.9",
]

[project.optional-dependencies]
# apply/reset shell out to ansible-playbook; plan works without it
ansible = ["ansible-core>=2.21.5"]

[project.scripts]
machine = "machinefile.cli:main"

[project.urls]
Homepage = "https://github.com/alanjds/machinefile"
Source = "https://github.com/alanjds/machinefile"
Issues = "https://github.com/alanjds/machinefile/issues"

[dependency-groups]
dev = [
    "machinefile[ansible]",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13"]
build-backend = "uv_build"

[tool.bumpversion]
current_version = "0.1.4"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "src/machinefile/__init__.py"
